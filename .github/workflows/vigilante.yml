name: Vigilante de la app

# Vigilante gratuito de la app (este repositorio es público, así que no gasta
# minutos). Cada 5 minutos, más o menos:
#  1. Recoge los avisos que deja la app al pulsar «Actualizar ahora» (o al
#     cambiar de hotel) y los pasa a la consulta privada, que lee Booking y
#     vuelve a publicar la app.
#  2. Repasa el horario (08:45, 14:00, 18:00, 23:30 y el cierre de las 00:01,
#     hora de Madrid) y lanza la consulta a su hora en punto: si la hora cae
#     antes de la vuelta siguiente, espera dentro de esta vuelta hasta esa hora.
#  3. Si el pedido trae la «suscripción» del móvil, la pasa también, para que
#     la consulta privada avise al móvil al terminar.
# No guarda ni enseña ningún dato del hotel: el canal de avisos, la llave y el
# repositorio privado están en los «secrets» de este repositorio.
#
# No depende del horario de GitHub (en esta cuenta no lanza las tareas
# programadas): cada vuelta espera 4 minutos en el entorno «pausa» (una espera
# que no ocupa ninguna máquina), mira, y al terminar pide la vuelta siguiente.
# El «cron» queda solo de reserva para volver a arrancar la cadena si se parase.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/vigilante.yml"]

permissions: {}

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    environment: pausa          # espera de 4 minutos (Settings › Environments › pausa)
    permissions:
      actions: write            # solo para pedir la vuelta siguiente
    timeout-minutes: 10         # hasta 6 min de espera para lanzar a la hora en punto
    steps:
      - name: Avisos de la app y horario
        env:
          TEMA: ${{ secrets.TEMA_PEDIDOS }}
          REPO: ${{ secrets.REPO_PEDIDOS }}
          CLAVE: ${{ secrets.CLAVE_PEDIDOS }}
          WEB: https://duque91.github.io/panel-hotel/version.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time, urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          MAD = ZoneInfo("Europe/Madrid")
          ahora = datetime.now(MAD)
          TEMA, REPO = os.environ["TEMA"], os.environ["REPO"]
          ACCIONES = ("precios", "buscar", "cambiar")
          CAMPOS = ("texto", "destino", "cambio", "hotel_actual", "nombre", "ciudad")
          TURNOS = ("08:45", "14:00", "18:00", "23:30")   # mismos que config.nube.yaml
          CIERRE = (0, 1)                                 # 00:01: precio final del día anterior
          ESPERA = timedelta(0)                           # se lanza a la hora en punto
          ANTICIPO = 330                                  # s: si la hora llega antes de la vuelta siguiente, se espera aquí
          SEPARACION = timedelta(minutes=8)               # entre dos pedidos seguidos
          MAX_PEDIDOS = 24                                # en 12 h, por si alguien abusa del canal

          def leer(url):
              req = urllib.request.Request(url, headers={"User-Agent": "vigilante-app", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8")

          def anotar(datos):
              req = urllib.request.Request("https://ntfy.sh/" + TEMA, data=json.dumps(datos).encode(),
                                           headers={"User-Agent": "vigilante-app"}, method="POST")
              urllib.request.urlopen(req, timeout=20).read()

          def hora(ts):
              return datetime.fromtimestamp(ts, MAD)

          def movil_de(d):
              """La suscripción del móvil del pedido, validada y compacta ('' si no hay)."""
              try:
                  m = d.get("movil")
                  m = json.loads(m) if isinstance(m, str) else m
                  e, k = str(m["endpoint"]), m["keys"]
                  if e.startswith("https://") and len(e) <= 1000 and k.get("p256dh") and k.get("auth"):
                      t = json.dumps({"endpoint": e, "keys": {"p256dh": str(k["p256dh"])[:200], "auth": str(k["auth"])[:100]}},
                                     separators=(",", ":"))
                      return t if len(t) <= 2000 else ""
              except Exception:
                  pass
              return ""

          def fecha(iso):
              try:
                  t = datetime.fromisoformat(iso or "")
              except ValueError:
                  return None
              return t if t.tzinfo else t.replace(tzinfo=MAD)

          # --- lo que hay en el canal (ntfy.sh guarda los mensajes 12 h) ---
          mensajes = []
          try:
              for linea in leer(f"https://ntfy.sh/{TEMA}/json?poll=1&since=12h").splitlines():
                  m = json.loads(linea)
                  if m.get("event") != "message":
                      continue
                  try:
                      m["datos"] = json.loads(m.get("message") or "")
                  except ValueError:
                      m["datos"] = {"accion": (m.get("message") or "").strip()}
                  if isinstance(m["datos"], dict):
                      mensajes.append(m)
          except Exception as exc:
              print("No se pudo leer el canal de avisos:", type(exc).__name__)
              sys.exit(0)                                 # se vuelve a mirar en 5 minutos
          mensajes.sort(key=lambda m: m.get("time", 0))
          recogidos = {i for m in mensajes for i in (m["datos"].get("recogido") or [])}
          lanzados = [m for m in mensajes if m["datos"].get("lanzado")]
          ultimo = max((hora(m["time"]) for m in lanzados), default=None)
          if ultimo and ahora - ultimo < SEPARACION:
              print("Hay un pedido en marcha desde las", ultimo.strftime("%H:%M"), "; se espera.")
              sys.exit(0)
          if len(lanzados) >= MAX_PEDIDOS:
              print("Demasiados pedidos en 12 horas; se espera.")
              sys.exit(0)

          pedido, recoger = None, []
          pendientes = [m for m in mensajes if m["id"] not in recogidos
                        and m["datos"].get("accion") in ACCIONES]
          if pendientes:
              p = pendientes[0]
              recoger = [p["id"]]
              if p["datos"]["accion"] == "precios":       # varios «Actualizar» seguidos = uno
                  recoger += [m["id"] for m in pendientes[1:] if m["datos"]["accion"] == "precios"]
              pedido = {"accion": p["datos"]["accion"]}
              pedido.update({k: " ".join(str(p["datos"].get(k, "")).split())[:300] for k in CAMPOS})
              juntos = [m for m in pendientes if m["id"] in recoger]
              movil = next((x for x in (movil_de(m["datos"]) for m in reversed(juntos)) if x), "")
              if movil:
                  pedido["movil"] = movil                 # para avisar al móvil al terminar
              print("Aviso de la app de las", hora(p["time"]).strftime("%H:%M"), "→", pedido["accion"])
          else:
              # --- repaso del horario ---
              # ¿Toca una consulta antes de la vuelta siguiente? Se espera aquí hasta su hora en punto.
              horas = [ahora.replace(hour=int(t[:2]), minute=int(t[3:]), second=0, microsecond=0) for t in TURNOS]
              horas.append(ahora.replace(hour=CIERRE[0], minute=CIERRE[1], second=0, microsecond=0))
              horas.append(horas[-1] + timedelta(days=1))
              cerca = [h for h in horas if 0 < (h - ahora).total_seconds() <= ANTICIPO]
              if cerca:
                  print("Se espera hasta las", min(cerca).strftime("%H:%M"), "para lanzar la consulta en punto.")
                  time.sleep((min(cerca) - ahora).total_seconds() + 2)
                  ahora = datetime.now(MAD)
              try:
                  v = json.loads(leer(os.environ["WEB"] + "?t=" + str(time.time())))
              except Exception as exc:
                  print("No se pudo leer la app publicada:", type(exc).__name__)
                  sys.exit(0)
              turno = None
              lectura = fecha(v.get("lectura"))
              if lectura is not None:
                  for t in reversed(TURNOS):
                      h, mi = map(int, t.split(":"))
                      desde = ahora.replace(hour=h, minute=mi, second=0, microsecond=0)
                      if desde + ESPERA <= ahora:
                          if lectura < desde and ahora - desde < timedelta(hours=4):
                              turno = ahora.strftime("%Y-%m-%d ") + t
                          break
              if turno is None and ahora.hour < 2 and ahora.minute + 60 * ahora.hour >= 60 * CIERRE[0] + CIERRE[1] \
                      and v.get("hoy") and v["hoy"] != ahora.strftime("%Y-%m-%d"):
                  turno = "cierre " + ahora.strftime("%Y-%m-%d")
              if turno is None:
                  print("Todo al día", ahora.strftime("%H:%M"))
                  sys.exit(0)
              veces = [m for m in lanzados if m["datos"].get("turno") == turno]
              if len(veces) >= 3 or (veces and ahora - hora(veces[-1]["time"]) < timedelta(minutes=40)):
                  print("La consulta de", turno, "ya se pidió; se espera.")
                  sys.exit(0)
              pedido = {"accion": "programada", "turno": turno}
              print("GitHub no lanzó la consulta de", turno, "; la lanza el vigilante.")

          # --- se deja el pedido en el repositorio privado (eso lanza la consulta) ---
          pedido["recibido"] = ahora.isoformat(timespec="seconds")
          ssh = Path.home() / ".ssh"
          ssh.mkdir(mode=0o700, exist_ok=True)
          (ssh / "id_pedidos").write_text(os.environ["CLAVE"].strip() + "\n")
          (ssh / "id_pedidos").chmod(0o600)
          conocidos = subprocess.run(["ssh-keyscan", "-t", "ed25519,rsa", "github.com"],
                                     capture_output=True, text=True).stdout
          (ssh / "known_hosts").write_text(conocidos)
          env = dict(os.environ, GIT_SSH_COMMAND=f"ssh -i {ssh / 'id_pedidos'} -o IdentitiesOnly=yes")

          def git(*args, cwd="r"):
              return subprocess.run(["git", *args], cwd=cwd, env=env, capture_output=True, text=True)

          r = git("clone", "-q", "--depth", "1", "--filter=blob:none", "--no-checkout",
                  f"git@github.com:{REPO}.git", "r", cwd=".")
          if r.returncode:
              print("::warning::No se pudo abrir el repositorio privado; se reintenta en la vuelta siguiente."); sys.exit(0)
          git("sparse-checkout", "set", "--no-cone", "/datos/pedido.json")
          git("checkout", "-q")
          git("config", "user.name", "Duque91")
          git("config", "user.email", "289804929+Duque91@users.noreply.github.com")
          Path("r/datos").mkdir(exist_ok=True)
          Path("r/datos/pedido.json").write_text(json.dumps(pedido, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          git("add", "datos/pedido.json")
          git("commit", "-q", "-m", f"Pedido desde la app: {pedido['accion']} ({ahora:%d/%m %H:%M})")
          for intento in range(3):
              if git("push", "-q", "origin", "HEAD:main").returncode == 0:
                  break
              git("pull", "-q", "--rebase", "origin", "main")
          else:
              print("::warning::No se pudo dejar el pedido; se reintenta en la vuelta siguiente."); sys.exit(0)
          anotar({"recogido": recoger, "lanzado": pedido["accion"], "turno": pedido.get("turno", ""),
                  "at": pedido["recibido"]})
          print("Pedido entregado: la consulta privada empieza ahora.")
          PY

      - name: Vuelta siguiente
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ¿Hay alguna vuelta del flujo $1 esperando o en marcha (sin contar esta)?
          activas() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?per_page=20" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.status == \"queued\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\" or .status == \"in_progress\")] | length"
          }
          # Una sola cadena: si ya hay otra vuelta esperando o en marcha, no se pide otra.
          arrancar() {
            for i in 1 2 3; do
              n=$(activas "$1") && break
              sleep 10
            done
            if [ -n "$n" ] && [ "$n" != "0" ]; then echo "$1: en marcha."; return 0; fi
            for i in 1 2 3; do
              if gh workflow run "$1" -R "$GITHUB_REPOSITORY" --ref main; then echo "$1: vuelta pedida."; return 0; fi
              sleep 15
            done
            echo "::error::No se pudo pedir la vuelta de $1."; return 1
          }
          ok=0
          arrancar vigilante.yml || ok=1
          arrancar guardian.yml || true      # el guardián vuelve a arrancar al vigilante si se parase
          exit $ok
